name: Build and publish CardLink

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset="dist/CardLink-${GITHUB_REF_NAME}.mnaddon"
          notes="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "CardLink ${GITHUB_REF_NAME}" --notes-file "${notes}" "${prerelease[@]}"
            if ! gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "${asset}")"; then
              gh release upload "${GITHUB_REF_NAME}" "${asset}"
            fi
          else
            gh release create "${GITHUB_REF_NAME}" "${asset}" --title "CardLink ${GITHUB_REF_NAME}" --notes-file "${notes}" "${prerelease[@]}"
          fi
      - name: Reuse the published package for mirrors
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download "${GITHUB_REF_NAME}" --pattern "CardLink-${GITHUB_REF_NAME}.mnaddon" --clobber --dir dist
      - name: Sync release to Gitee mirror
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: baidreams/CardLink
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES_FILE: RELEASE_NOTES_${{ github.ref_name }}.md
        run: node scripts/sync-gitee-release-notes.mjs
      - name: Upload manual-build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CardLink
          path: dist/CardLink-v*.mnaddon
